<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>日语听写训练 V2</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#172033;--muted:#667085;--line:#dfe3e8;--accent:#203a70;--ok:#147a50;--bad:#b42318;--warn:#9a6700}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:960px;margin:28px auto;padding:0 16px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}
h1{font-size:28px;margin:0 0 6px}.sub{font-size:14px;color:var(--muted)}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.toolbar,.controls,.audio,.badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar button,.controls button,.audio button,input[type=file]{font:inherit;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px}
button{cursor:pointer} button.primary{background:var(--accent);border-color:var(--accent);color:white}
.badge{font-size:12px;font-weight:700;padding:5px 9px;border-radius:99px;background:#eef2f8}
.audio{justify-content:center;margin:24px 0 18px}.audio button{font-size:17px;padding:12px 16px}
textarea{width:100%;min-height:120px;border:1px solid #c9d0d9;border-radius:10px;padding:13px;font:20px/1.7 "Hiragino Sans","Yu Gothic",sans-serif;resize:vertical}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:10px;background:#f8fafc}.feedback .score{font-size:18px;font-weight:800}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.answer{font-size:20px;line-height:1.7;margin:8px 0}.meta{font-size:13px;line-height:1.8;color:var(--muted)}
.diff{font-size:18px;line-height:1.8;margin-top:10px}.diff del{background:#fee4e2;color:#912018;text-decoration:line-through}.diff ins{background:#dcfae6;color:#05603a;text-decoration:none}
.stats{font-size:13px;color:var(--muted);text-align:right;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.progress{height:7px;background:#e9ecf1;border-radius:99px;overflow:hidden;margin-top:16px}.bar{height:100%;background:var(--accent);width:0}
.hidden{display:none}.wronglist{max-height:320px;overflow:auto;border-top:1px solid var(--line);margin-top:12px}.wrongitem{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.smallbtn{font-size:12px;padding:6px 9px!important}.note{font-size:12px;color:var(--muted);line-height:1.6}
@media(max-width:700px){.top{flex-direction:column}.stats{text-align:left}.grid{grid-template-columns:1fr}.panel{padding:16px}}
</style></head>
<body><div class="wrap">
<div class="top"><div><h1>日语听写训练 V2</h1><div class="sub">1000句 · N2 / N1 / N1+ · 错题本 · 学习记录 · JSON/CSV 导入</div></div><div class="stats" id="stats"></div></div>

<div class="panel">
<div class="toolbar">
<select id="levelFilter"><option value="ALL">全部等级</option><option>N2</option><option>N1</option><option>N1+</option></select>
<select id="catFilter"><option value="ALL">全部分类</option></select>
<select id="modeFilter"><option value="normal">正常练习</option><option value="wrong">只练错题</option></select>
<select id="rate"><option value=".75">0.75×</option><option value=".9">0.9×</option><option value="1" selected>1.0×</option><option value="1.1">1.1×</option><option value="1.2">1.2×</option></select>
<button id="shuffleBtn">随机顺序</button>
<button id="wrongBtn">查看错题本</button>
</div>
<div class="note" style="margin-top:8px">默认题库已内置，可直接用。也可以在下方导入你自己的 JSON/CSV 题库。</div>
</div>

<div class="panel">
<div class="badges"><span class="badge" id="num"></span><span class="badge" id="lvl"></span><span class="badge" id="cat"></span><span class="badge" id="grammar"></span></div>
<div class="audio"><button class="primary" id="playBtn">▶︎ 播放</button><button id="replayBtn">↻ 再听一次</button></div>
<textarea id="input" lang="ja" placeholder="ここに聞こえた日本語を入力してください…"></textarea>
<div class="controls" style="margin-top:11px">
<button class="primary" id="checkBtn">检查答案</button>
<button id="hintBtn">提示</button>
<button id="showBtn">显示答案</button>
<button id="nextBtn">下一题 →</button>
</div>
<div class="feedback" id="feedback"></div>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>

<div class="panel">
<div class="grid">
<div>
<strong>导入自己的题库</strong>
<div class="note">支持 JSON 或 CSV。字段建议：level, category, text, kana, zh, grammar。</div>
<input type="file" id="importFile" accept=".json,.csv" style="margin-top:8px">
<button id="importBtn" class="smallbtn">导入</button>
</div>
<div>
<strong>学习数据</strong>
<div class="note">进度和错题保存在当前浏览器 localStorage 中。</div>
<button id="exportWrongBtn" class="smallbtn">导出错题 JSON</button>
<button id="resetBtn" class="smallbtn">清空学习记录</button>
</div>
</div>
</div>

<div class="panel hidden" id="wrongPanel">
<strong>错题本</strong><div class="note">按错误次数排序。点击“练这题”可跳转。</div>
<div class="wronglist" id="wrongList"></div>
</div>
</div>
<script>

針については今後さらに重要になると考えられています。", "kana": "そのため、チームのほうしんについてはこんごさらにじゅうようになるとかんがえられています。", "zh": "因此，关于团队方针，被认为今后会更加重要。", "grammar": "〜と考えられている", "source": "AI-generated practice corpus"}, {"id": 10, "level": "N2", "category": "工作", "text": "チームの方針に関しては、今後さらに重要になると考えられています。", "kana": "チームのほうしんにかんしては、こんごさらにじゅうようになるとかんがえられています。", "zh": "关于团队方针，被认为今后会更加重要。", "grammar": "〜と考えられている", "source": "AI-generated practice corpus"}, {"id": 11, "level": "N2", "category": "工作", "text": "そのため、今回の計画については思ったほど簡単ではありませんでした。", "kana": "そのため、こんかいのけいかくについてはおもったほどかんたんではありませんでした。", "zh": "因此，关于这次计划，并没有想象中那么简单。", "grammar": "〜ほど〜ない", "source": "AI-generated practice corpus"}, {"id": 12, "level": "N2", "category": "新闻", "text": "そのため、今回の調査についてはもう少し具体的に考える必要があります。", "kana": "そのため、こんかいのちょうさについてはもうすこしぐたいてきにかんがえるひつようがあります。", "zh": "因此，关于这次调查，有必要再具体考虑一下。", "grammar": "〜必要がある", "source": "AI-generated practice corpus"}, {"id": 13, "level": "N2", "category": "工作", "text": "働き方の変化を考えると、予定どおり進められるとは限りません。", "kana": "はたらきかたのへんかをかんがえると、よていどおりすすめられるとはかぎりません。", "zh": "考虑到工作方式的变化，不一定能按计划推进。", "grammar": "〜とは限らない", "source": "AI-generated practice corpus"}, {"id": 14, "level": "N2", "category": "社会", "text": "新しい制度については、予定どおり進められるとは限りません。", "kana": "あたらしいせいどについては、よていどおりすすめられるとはかぎりません。", "zh": "关于新制度，不一定能按计划推进。", "grammar": "〜とは限らない", "source": "AI-generated practice corpus"}, {"id": 15, "level": "N2", "category": "工作", "text": "長期的な目標については、状況に応じて方法を変える必要があります。", "kana": "ちょうきてきなもくひょうについては、じょうきょうにおうじてほうほうをかえるひつようがあります。", "zh": "关于长期目标，需要根据情况改变方法。", "grammar": "〜に応じて", "source": "AI-generated practice corpus"}, {"id": 16, "level": "N2", "category": "教育", "text": "その一方で、子どもの教育については状況に応じて方法を変える必要があります。", "kana": "そのいっぽうで、こどものきょういくについてはじょうきょうにおうじてほうほうをかえるひつようがあります。", "zh": "另一方面，关于孩子的教育，需要根据情况改变方法。", "grammar": "〜に応じて", "source": "AI-generated practice corpus"}, {"id": 17, "level": "N2", "category": "社会", "text": "現時点では、新しい制度については事前に十分な説明をしておいたほうがいいでしょう。", "kana": "げんじてんでは、あたらしいせいどについてはじぜんにじゅうぶんなせつめいをしておいたほうがいいでしょう。 function saveState(){ localStorage.setItem("jpDictV2", JSON.stringify(state)); }
function allQuestions(){ return BUILTIN.concat(custom); }
function clean(s){ return (s||"").normalize("NFKC").replace(/[、。！？!?.,，．\s「」『』（）()]/g,""); }

function levenshtein(a,b){
  a=clean(a); b=clean(b);
  var n=a.length,m=b.length, prev=[],cur=[];
  for(var j=0;j<=m;j++) prev[j]=j;
  for(var i=1;i<=n;i++){
    cur=[i];
    for(var j=1;j<=m;j++) cur[j]=(a[i-1]===b[j-1])?prev[j-1]:1+Math.min(prev[j],cur[j-1],prev[j-1]);
    prev=cur;
  }
  return prev[m];
}
function similarity(a,b){
  var aa=clean(a),bb=clean(b),max=Math.max(aa.length,bb.length,1),d=levenshtein(aa,bb);
  return Math.max(0,Math.round((1-d/max)*100));
}
function charDiff(a,b){
  a=clean(a); b=clean(b);
  var n=a.length,m=b.length,dp=[],i,j;
  for(i=0;i<=n;i++){dp[i]=[];for(j=0;j<=m;j++)dp[i][j]=0;}
  for(i=1;i<=n;i++)for(j=1;j<=m;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  i=n;j=m;var out=[];
  while(i>0||j>0){
    if(i>0&&j>0&&a[i-1]===b[j-1]){out.push({t:"same",c:a[i-1]});i--;j--;}
    else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])){out.push({t:"ins",c:b[j-1]});j--;}
    else{out.push({t:"del",c:a[i-1]});i--;}
  }
  out.reverse();
  var s="";
  out.forEach(function(x){
    if(x.t==="same")s+=escapeHtml(x.c);
    else if(x.t==="del")s+="<del>"+escapeHtml(x.c)+"</del>";
    else s+="<ins>"+escapeHtml(x.c)+"</ins>";
  }); return s;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

function rebuildPool(){
  var level=$("levelFilter").value,cat=$("catFilter").value,mode=$("modeFilter").value;
  pool=allQuestions().filter(function(q){
    if(level!=="ALL"&&q.level!==level)return false;
    if(cat!=="ALL"&&q.category!==cat)return false;
    if(mode==="wrong"){
      var st=state.items[String(q.id)];
      if(!st||!st.wrongCount)return false;
    }
    return true;
  });
  if(shuffled) pool.sort(function(){return Math.random()-.5;});
  current=0; render();
}
function render(){
  if(!pool.length){
    $("num").textContent="没有符合条件的题目"; $("lvl").textContent=""; $("cat").textContent=""; $("grammar").textContent="";
    $("feedback").style.display="block"; $("feedback").innerHTML='<div class="warn">当前筛选下没有题目。</div>'; updateStats(); return;
  }
  var q=pool[current];
  $("num").textContent="第 "+(current+1)+" / "+pool.length+" 题";
  $("lvl").textContent=q.level||""; $("cat").textContent=q.category||""; $("grammar").textContent=q.grammar||"";
  $("input").value=""; $("feedback").style.display="none"; $("feedback").innerHTML="";
  $("bar").style.width=((current)/Math.max(pool.length,1)*100)+"%";
  updateStats(); $("input").focus();
}
function updateStats(){
  $("stats").innerHTML="已答 "+state.attempts+" 次<br>完全正确 "+state.exact+" 次 · "+(state.attempts?Math.round(state.exact/state.attempts*100):0)+"%";
}
function speak(){
  if(!pool.length)return;
  if(!("speechSynthesis" in window)){alert("浏览器不支持语音朗读，请用 Safari 或 Chrome。");return;}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(pool[current].text);u.lang="ja-JP";u.rate=parseFloat($("rate").value);
  var vs=speechSynthesis.getVoices().filter(function(v){return (v.lang||"").toLowerCase().indexOf("ja")===0;});
  if(vs.length)u.voice=vs[0];
  speechSynthesis.speak(u);
}
function showDetails(q, headline, cls, mine, score, withDiff){
  var f=$("feedback"); f.style.display="block";
  var diffhtml=withDiff?'<div class="meta">差异（红色=你的多余/错误文字，绿色=正确答案缺少的文字）</div><div class="diff">'+charDiff(mine,q.text)+'</div>':"";
  f.innerHTML='<div class="score '+cls+'">'+headline+'</div>'+diffhtml+
    '<div class="meta" style="margin-top:10px">正确答案</div><div class="answer">'+escapeHtml(q.text)+'</div>'+
    '<div class="meta">かな：'+escapeHtml(q.kana||"—")+'<br>中文：'+escapeHtml(q.zh||"—")+'<br>重点：'+escapeHtml(q.grammar||"—")+'</div>';
}
function check(){
  if(!pool.length)return;
  var mine=$("input").value,q=pool[current];
  if(!clean(mine)){ $("feedback").style.display="block";$("feedback").innerHTML='<div class="bad">请先输入你听到的内容。</div>';return; }
  var score=similarity(mine,q.text), exact=clean(mine)===clean(q.text), key=String(q.id);
  state.attempts++; if(exact)state.exact++;
  if(!state.items[key])state.items[key]={attempts:0,wrongCount:0,best:0,lastAnswer:""};
  state.items[key].attempts++; state.items[key].best=Math.max(state.items[key].best,score); state.items[key].lastAnswer=mine;
  if(!exact)state.items[key].wrongCount++;
  saveState();
  showDetails(q, exact?"✓ 完全正确":"文字一致度 "+score+"%", exact?"ok":"bad", mine, score, !exact);
  updateStats();
}
function showAnswer(){ if(pool.length)showDetails(pool[current],"正确答案","warn","",0,false); }
function hint(){
  if(!pool.length)return;var q=pool[current],s=clean(q.text),n=Math.max(2,Math.floor(s.length*.18));
  $("feedback").style.display="block";$("feedback").innerHTML='<div class="meta">语法提示：'+escapeHtml(q.grammar||"—")+'</div><div class="answer">'+escapeHtml(s.slice(0,n))+'……</div><div class="meta">共约 '+s.length+' 个文字</div>';
}
function next(){if(!pool.length)return;current=(current+1)%pool.length;render();}
function fillCats(){

}
function renderWrong(){

  arr.sort(function(a,b){return b.st.wrongCount-a.st.wrongCount;});
  $("wrongList").innerHTML=arr.length?arr.map(function(x){
    return '<div class="wrongitem"><strong>'+escapeHtml(x.q.text)+'</strong><br><span class="meta">错误 '+x.st.wrongCount+' 次 · 最佳 '+x.st.best+'% · '+escapeHtml(x.q.level)+' / '+escapeHtml(x.q.category)+'</span> <button class="smallbtn" onclick="jumpTo('+x.q.id+')">练这题</button></div>';
  }).join(""):'<div class="note">目前还没有错题。</div>';

function jumpTo(id){

  var i=pool.findIndex(function(q){return Number(q.id)===Number(id);});if(i>=0){current=i;render();$("wrongPanel").classList.add("hidden");}
}
function parseCSV(text){
  var lines=text.replace(/\r/g,"").split("\n").filter(Boolean); if(lines.length<2)return [];
  var headers=splitCSVLine(lines[0]); return lines.slice(1).map(function(line,idx){
    var vals=splitCSVLine(line),o={};headers.forEach(function(h,i){o[h.trim()]=vals[i]||"";});
    o.id="custom_"+Date.now()+"_"+idx;return o;
  }).filter(function(o){return o.text;});
}
function splitCSVLine(line){
  var a=[],cur="",q=false;
  for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(c===","&&!q){a.push(cur);cur="";}else cur+=c;}a.push(cur);return a;
}

      custom=custom.concat(x);fillCats();rebuildPool();alert("已导入 "+x.length+" 题。本次浏览器页面有效；如需长期保存，请保留原题库文件。");
